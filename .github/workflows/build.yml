name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          unzip -o android-project.zip
          if [ -d "android-project" ]; then
            cp -rf android-project/* .
          fi

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Générer Gradle Wrapper et compiler l'APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
