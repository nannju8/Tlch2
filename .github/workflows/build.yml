name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser et localiser le projet Android
        run: |
          unzip -o "android-project.zip" -d extracted_proj || unzip -o "Android project.zip" -d extracted_proj
          ANDROID_DIR=$(find extracted_proj -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV
          echo "Projet trouvé dans : $ANDROID_DIR"

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Générer Gradle Wrapper et compiler l'APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VidGrab-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
